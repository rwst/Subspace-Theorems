version: "v0.4"

project:
  name: "Adamczewski–Bugeaud 2007: the complexity of algebraic numbers in integer bases"
  description: >-
    A Lean 4 / Mathlib formalization of B. Adamczewski and Y. Bugeaud, On the
    complexity of algebraic numbers I. Expansions in integer bases (Ann. of
    Math. 165 (2007)), built on the repository's libraries ArithmeticHeights,
    DiophantineApproximation and ForMathlib, whose Subspace Theorem with
    algebraic coefficients it uses. The library AdamczewskiBugeaud2007 is
    sorry-free and within Lean's three standard axioms. It proves Theorem 1
    (the complexity of an irrational algebraic number in an integer base
    satisfies p(n)/n → ∞, with (1), p(n) − n → ∞), Theorems 2–4 (automatic
    and morphic expansions), Theorem 5 in full (β Pisot or Salem, bounded
    integer digits satisfying Condition (∗)_w: the number lies in ℚ(β) or is
    transcendental), Lemma 1, Theorems 1A–5A on β-expansions with K. Schmidt's
    periodicity theorem, and the p-adic Theorems 6 and 1B–4B, together with
    the finite automata and morphisms of §3, and Theorem 7 in corrected form
    (u_k < min(b, p)) with Christol's theorem (algebraic ⇒ automatic) and a
    counterexample to Theorem 7 as printed. The counterexample and the
    corrected hypothesis were worked out during this formalization, not taken
    from the cited works (see limitations). Thirty-two statements are
    compared.
  authors:
    - "Ralf Stephan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ralf Stephan"

classification:
  arxiv: [math.NT]
  msc2020: ["11J81", "11A63", "11K16", "11R06", "68R15"]

status:
  scope: >-
    The thirty-two declarations named in
    comparator/adamczewski-bugeaud-2007.json, listed under main_results: every
    numbered theorem of the paper (Theorem 7 corrected, with a
    counterexample to its printed form), Lemma 1, the complexity bound (1),
    and the facts the paper quotes (Eilenberg's characterization of
    automatic sequences, Cobham's bound p(n) = O(n), K. Schmidt's theorem,
    the direction algebraic ⇒ automatic of Christol's theorem), which are
    proved here. Theorem 1 is the
    repository's DiophantineApproximation (Layer 7.4); it is compared here
    because the paper is built around it. Where the paper's form and a
    working form differ, both are compared (Theorem 2, Theorem 2A,
    Theorem 5, Theorems 1B and 6). The Conjecture and the ternary problem
    after Theorem 4 are open; they are stated as propositions in
    OpenProblems.lean, not proved, and not compared. Not formalized:
    the direction automatic ⇒ algebraic of Christol's theorem (not used),
    the remark that Condition
    (∗)_w survives a non-erasing morphism, and the Fibonacci word of §7.
    Theorem E (the Subspace Theorem in Evertse's form) is not restated; the
    proofs apply the repository's Subspace Theorem with algebraic
    coefficients directly.
