fidelity:
  divergences: >-
    Condition (∗)_w of the paper includes non-periodicity; here
    Function.IsStammering is only the repetition condition (with the paper's
    length ⌈w s⌉), and each criterion takes non-periodicity as a separate
    hypothesis where it is needed. Theorem 5 and Theorems 1A–4A need none:
    an eventually periodic sequence already gives a number of ℚ(β). Theorem 5
    and Theorems 1A–4A are stated for a real algebraic integer β > 1 whose
    other conjugates have modulus at most 1, which is all the proof uses and
    covers both Pisot and Salem numbers; the Pisot and Salem forms of
    Theorem 5 are compared as well. The β-expansion is the greedy one given by
    the β-transformation; for Theorems 1A, 2A and 4A its digits are read as
    letters of {0, …, ⌊β⌋}, and Theorem 3A takes a binary sequence equal to
    the digits. Automatic sequences are defined by a finite k-kernel, and
    also by the paper's k-automata (least significant digit first); the two
    are proved equivalent, and Theorems 2 and 2A are compared in both forms.
    Theorems 3 and 4 hold for every base b ≥ 2 (Theorem 4 as printed asks
    b ≥ 3), and Theorem 4's proof takes the letter of maximal growth among the
    letters that occur, which closes a small gap in the printed proof. The
    p-adic expansions are stated twice: with digits from k = 0 (Padic.ofDigits)
    and, as printed, for the Hensel expansion ∑_{k ≥ -m} a_k p^k of a given
    α ∈ ℚ_p, with Condition (∗)_w on (a_k)_{k ≥ 1}. A p-adic irrational is
    written x ∉ Set.range ((↑) : ℚ → ℚ_[p]). Lemma 1 is stated with the
    denominator β^r (β^s − 1) of the approximation multiplied out, and the
    paper's 1/d normalization of heights is replaced by Mathlib's weights,
    which the product formula also carries. Theorem 7 is false as printed
    (see limitations) and is stated with u_k < min(b, p), the hypothesis its
    proof uses; indices start at k = 0 (the paper's objects when u_0 = 0),
    and "algebraic over 𝔽_p(X)" is stated over 𝔽_p[X], equivalent for an
    element of 𝔽_p⟦X⟧. Christol's theorem is proved from CKMR80 §7 inside
    K⟦X⟧: CKMR80 divide by a₀ in K((X)); here the finite stable set is
    {s : a₀ s = ∑ c_i f^(q^i), deg c_i ≤ N}.
    The single-file challenge differs from the development in presentation
    only (see COMPARATOR.md at the repository root). Its Mathlib imports
    follow the development's load order, and each part opens with a run_cmd
    that clears Lean's module-local cache of auxiliary proofs, as a module
    boundary does.

sources:
  - title: >-
      On the complexity of algebraic numbers I. Expansions in integer bases
    authors: ["Boris Adamczewski", "Yann Bugeaud"]
    type: paper
    location: >-
      Ann. of Math. (2) 165 (2007), 547–565; arXiv:math/0511674. Theorems
      1–6, 1A–5A, 1B–4B, Lemma 1, (1), and the facts of §§3–5 it quotes
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      The whole paper, Theorem 7 in corrected form; the Conjecture and the
      ternary problem after Theorem 4 are open and only stated. The module
      docs cite it by section and result.
  - title: >-
      On periodic expansions of Pisot numbers and Salem numbers
    authors: ["Klaus Schmidt"]
    type: paper
    location: "Bull. London Math. Soc. 12 (1980), 269–278; the Pisot case"
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Quoted by the paper to derive Theorem 5A; proved here
      (Real.isEventuallyPeriodic_betaDigits_of_mem_adjoin).
  - title: "Suites algébriques, automates et substitutions"
    authors: ["Gilles Christol", "Teturo Kamae", "Michel Mendès France", "Gérard Rauzy"]
    type: paper
    location: "Bull. Soc. Math. France 108 (1980), 401–419; Théorème 1, (iii) ⇒ (i), proof in §7"
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Quoted by the paper for Theorem 7; the direction algebraic ⇒ automatic
      is proved here (PowerSeries.finite_kKernel_coeff_of_isAlgebraic).
  - title: "Une approche arithmétique des systèmes de numération"
    authors: ["Boris Adamczewski"]
    type: other
    location: "Habilitation, Université Lyon 1, 2010, §7.2, Théorème 7.1"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Restates Theorem 7 for b = p with digits in {0, …, p − 1}; the corrected
      Theorem 7 here contains it.

automation:
  methods:
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      role: >-
        The formalization: the plan, the Lean text of the library, the
        challenge and solution modules and the configuration, under the
        releaser's direction.
    - method: manual
      models: []
      role: >-
        Direction and release. Ralf Stephan chose the paper, the conventions
        and the gates, steered the agent turn by turn, and releases the
        repository.
  spend_usd: "subscription-based Claude Code usage; Max 00 subscription"
  notes: >-
    The library is held to the repository's rules by scripts/check.sh (a
    build with Mathlib's linter set as errors, the axiom audit against the
    three standard axioms, the module-system check, the textual guards).
    It has 16 files. lake test runs leanprover/comparator over
    comparator/adamczewski-bugeaud-2007.json against the single Mathlib-only
    file ChallengeAdamczewskiBugeaud2007.lean, generated from
    comparator/adamczewski-bugeaud-2007.txt by
    scripts/make-challenge.py --paper AdamczewskiBugeaud2007, with the proofs
    re-exported by SolutionAdamczewskiBugeaud2007.lean. It passes. A negative
    control (Theorem 5A with IsSalem in place of IsPisot in the challenge, the
    open Salem case) was confirmed to be rejected, and so was a second
    (Theorem 7 without the bound u_k < p, which the counterexample refutes). Wall time and hardware
    were not recorded.

review:
  status: unchecked
  notes: >-
    No human or external review of the Lean text or of the fidelity of the
    statements has been performed. What is established is mechanical:
    comparator compares each named statement against the challenge file
    constant by constant, checks the axiom list, and replays the export
    through the Lean kernel.

limitations:
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound
    and nothing else. The library contains no sorry and no native_decide.
    The sorries in the challenge file are the placeholders comparator
    expects, and the configuration fixes no definition holes.
  - >-
    Theorem 7 is false as printed ("a sequence of integers u"): for p = 5,
    b = 2 there are digits in {0, 1, 2, 3} whose base-2 value is 1 and whose
    power series over 𝔽_5 is algebraic but not rational
    (exists_counterexample_theorem7). No erratum was found; Adamczewski's
    habilitation (Lyon, 2010, Théorème 7.1) restates it for b = p with
    digits below p. The formalized statement asks u_k < min(b, p).
  - >-
    The Subspace Theorem the proofs rest on is the repository's own
    (DiophantineApproximation), certified separately by
    comparator/std3-flat.json.
  - >-
    Provenance. The results proved here are taken from the cited works (the
    paper; K. Schmidt 1980; Christol, Kamae, Mendès France and Rauzy 1980;
    and the standard facts the paper quotes), with two exceptions: the
    counterexample to Theorem 7 as printed (exists_counterexample_theorem7,
    not_forall_theorem7_as_printed) and the corrected statement under the
    hypothesis u_k < min(b, p) (Real.isAlgebraic_and_isAlgebraic_iff). Both
    were worked out during this formalization. The hypothesis u_k < min(b, p)
    is the one the paper's own proof of Theorem 7 uses, and its special case
    b = p is stated in Adamczewski's habilitation (Théorème 7.1). We did not
    find the counterexample or the min(b, p) form in the sources we consulted
    (the published paper, the habilitation, and a search for an erratum).
    Whether either appeared earlier elsewhere is unknown, and no priority is
    claimed. The smaller departures described under scope (Theorems 3 and 4
    for every b ≥ 2, the choice of the letter of maximal growth among the
    letters that occur in Theorem 4's proof, and Christol's proof kept inside
    K⟦X⟧) adjust the printed proofs and are not offered as new results.

