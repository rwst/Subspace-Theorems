fidelity:
  divergences: >-
    Absolute values and places are Mathlib's (infinite places of a number
    field, finite places as a finite set S), not the book's abstract set of
    places; Evertse's systems are indexed by InfinitePlace K ⊕ S, and the
    exponents are the same numbers in his normalization and Mathlib's. The
    Subspace Theorem is stated through named quantities, approxProd for the
    projective forms, affineProd for S-integral points and generalProd for
    Vojta's form, each defined in the development and compared by value.
    Where a statement is stronger than the book's the module doc records
    it; for instance, the decomposable-form theorem assumes no pairwise
    non-proportionality, since none is used. In Layer 9 the
    intermediate count below n^(2n/δ) of Evertse's Theorem 2.2 is replaced
    by a cruder one that his final constants still absorb, and over ℚ the
    lattice-point lemma he quotes (Evertse 2000, Lemma 5) is proved by a
    pigeonhole on the minima of an approximation domain. The 9.4 statement
    takes Evertse's interval result (his Theorem 3.1) as a hypothesis; see
    status.scope.
    The single-file challenge differs from the development in presentation
    only, and COMPARATOR.md records why. Its Mathlib imports follow the
    development's load order, because Lean breaks ties between instances of
    equal priority by load order. In the parts copied from modules that
    descend from DiophantineApproximation/ApproxProd.lean (and from
    ArithmeticHeights/BombieriVaaler.lean), local attribute commands lower
    the priority of FaithfulSMul and Nontrivial instances, because those
    modules load Mathlib in a different order from the rest of the
    development. These are instances of propositions, so the attribute
    commands change which proof a statement carries, never what it says.
    Each part also opens with a run_cmd that clears Lean's module-local
    cache of auxiliary proofs, as a module boundary does. The per-module
    challenge tree Challenge/, which needs none of this, passes the same
    comparison.
    Lemma names follow the development, not the book's numbering.

sources:
  - title: "Heights in Diophantine Geometry"
    authors: ["Enrico Bombieri", "Walter Gubler"]
    type: book
    location: >-
      New Mathematical Monographs 4, Cambridge University Press 2006;
      Chapters 1–2 (heights, Siegel's lemma), 6 (Roth's theorem) and 7
      (the Subspace Theorem and its applications), Appendix C (geometry of
      numbers)
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      The main source. The milestones and most proofs follow it; the module
      docs cite it by theorem number.

  - title: "Diophantine Approximation"
    authors: ["Wolfgang M. Schmidt"]
    type: book
    location: "Lecture Notes in Mathematics 785, Springer 1980"
    relationship: adapts
    author_endorsement: "n/a"
    note: >-
      Schmidt's proof of the Subspace Theorem, which Bombieri–Gubler's
      Chapter 7 presents over number fields and which the development
      follows in general, together with his theorems on simultaneous
      approximation (Chapter VI). Schmidt's Lemma 4, the composite Gram
      determinant, is proved in the development as
      NumberField.mixedEmbedding.norm_det_gram.

  - title: "On Siegel's lemma"
    authors: ["Enrico Bombieri", "Jeffrey D. Vaaler"]
    type: paper
    location: "Invent. Math. 73 (1983), 11–32; Theorems 1 and 2"
    relationship: formalizes
    author_endorsement: not-contacted
    note: "Layer 5.2 of ArithmeticHeights."

  - title: "On the Quantitative Subspace Theorem"
    authors: ["Jan-Hendrik Evertse"]
    type: paper
    location: >-
      Zap. Nauchn. Sem. POMI 377 (2010), 217–240; J. Math. Sci. 171 (2010),
      824–837; arXiv:1008.2268. §2, Theorem A, Propositions 4.1–4.2,
      Lemmas 4.3–4.5, Theorem 2.2 and the proof of Theorem 2.1
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Layer 9 of DiophantineApproximation. Theorem 2.1 is proved only from
      the interval result taken as a hypothesis, and for two variables
      unconditionally; see status.scope.

  - title: "The ArithmeticHeights and DiophantineApproximation roadmaps"
    authors: ["Ralf Stephan"]
    type: blueprint
    location: >-
      ArithmeticHeights/README.md and DiophantineApproximation/README.md in
      this repository
    relationship: other
    author_endorsement: participated
    note: >-
      The milestone plan the libraries implement, layer by layer, written
      from Bombieri–Gubler by the Fable-5 agent under the releaser's
      direction. The mathematics is that of the sources above; the roadmaps
      fix the order, the Lean shapes of the statements and the milestone
      numbering the module docs refer to. Not reviewed.

automation:
  methods:
    - method: agent
      models: ["claude-fable-5"]
      framework: "Claude Code"
      role: >-
        The roadmaps: the two README.md files that split Bombieri–Gubler into
        layered milestones with suggested Lean statements, under the
        releaser's direction.
    - method: agent
      models: ["claude-opus-5"]
      framework: "Claude Code"
      role: >-
        Most of the formalization: the Lean text of both libraries, driven
        milestone by milestone from the roadmaps under the releaser's
        direction, which fixed the targets and the gates.
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      role: >-
        Part of the formalization, among it the Roth interval result for two
        variables and its link into Layer 9.4, and the comparator setup: the
        generator scripts/make-challenge.py, the challenge and solution
        modules and the configurations.
    - method: manual
      models: []
      role: >-
        Direction and release. Ralf Stephan chose the target, the sources
        and the Tau Ceti conventions the libraries follow, set the
        axiom-hygiene gates, steered the agents turn by turn, selected which
        outputs to keep, and releases the repository.
  spend_usd: "subscription-based Claude Code usage; per-project spend not recorded separately"
  notes: >-
    The libraries are held to Tau Ceti's rules by scripts/check.sh, adapted
    from Tau Ceti's CI (scripts/PROVENANCE.md): a build with Mathlib's linter
    set as errors, an axiom audit of every declaration against the three
    standard axioms, the module-system check, environment linters, and
    textual guards against sorry-allowed or challenge imports, set_option and
    import Mathlib. On the tree as submitted it reports 203 library files and
    5048 declarations within the allowlist. lake test runs
    leanprover/comparator over two configurations stating the same
    twenty-six theorems: comparator/std3.json against the per-module
    challenge tree, and comparator/std3-flat.json against the single
    Mathlib-only file ChallengeFlat.lean, which is the one submitted. Both
    are generated from comparator/theorems.txt by scripts/make-challenge.py,
    which copies every definition in the compared closure verbatim and
    refuses any theorem whose closure reaches a private constant. Both pass.
    Three negative controls were confirmed to bite: a weakened hypothesis,
    the removal of the cache resets, and the removal of the instance
    attribute commands. Roadmap/Suggested.lean holds sorry-allowed target
    signatures; it is not a default target, and no library file or challenge
    imports it. Wall time and hardware were not recorded.

review:
  status: unchecked
  notes: >-
    No human or external review of the Lean text or of the fidelity of the
    statements has been performed. The releaser directed the work and chose
    which outputs to keep. The roadmaps are marked in the repository as
    preliminary and unreviewed. What is established is mechanical:
    comparator compares each named statement against the challenge file
    constant by constant, checks the axiom list, and replays the export
    through the Lean kernel.

limitations:
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound
    and nothing else. The libraries contain no sorry and no native_decide.
    The sorries in the challenge file are the placeholders comparator
    expects, and the configuration fixes no definition holes.
  - >-
    The Subspace Theorem is qualitative. Layer 9 gives Evertse's count of
    the small solutions and turns height intervals into a count of
    subspaces; the interval result for the large solutions is proved only
    for two variables, so no quantitative Subspace Theorem in n variables is
    claimed.
  - >-
    Not compared, though proved: Layers 5.3 and 5.4 and the other statements
    about the height of a subspace, which reach private constants, and, for
    size, the applications of Layers 7 and 8 and the rest of
    ArithmeticHeights. The flat challenge is 823 lines and 41 KiB, within the
    hard limits and above the warning thresholds.
  - >-
    The degenerate case of Schmidt's norm-form theorem is proved only up to
    finitely many families inside subfields; the families themselves, which
    need orders and their unit theorem, are located but not described.
  - >-
    Everything proved here is classical and in print; no novelty is
    claimed. The value offered is the machine-checked account.

