# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Heights, Siegel's lemma, Roth's theorem and the Subspace Theorems in Lean"
  description: >-
    A Lean 4 / Mathlib development of Schmidt's Subspace Theorem and the
    theory beneath it, following Bombieri–Gubler, Heights in Diophantine
    Geometry (Chapters 1–7), and Schmidt's route in general. Two libraries,
    sorry-free and within Lean's three standard axioms. ArithmeticHeights
    builds heights of points, polynomials, matrices and linear subspaces,
    Northcott and Kronecker, Minkowski's second theorem, Siegel's lemma and
    the Bombieri–Vaaler theorems. DiophantineApproximation builds on it
    Roth's theorem over a number field with several places (and Ridout, the
    p-adic form, targets at infinity, moving targets), the geometry of
    numbers of approximation domains, and the Subspace Theorem: parametric,
    with coefficients in K, with algebraic coefficients, for S-integral
    points, and in Vojta's general-position form. It then proves the
    applications — Schmidt's simultaneous approximation, a transcendence
    criterion, unit equations, decomposable-form, Thue–Mahler, hyperelliptic
    and norm-form equations, the Corvaja–Zannier gcd bound — and Evertse's
    quantitative steps: systems of inequalities, the gap principles, the
    count of small solutions, and the passage from height intervals to
    subspaces. Twenty-six headline statements are compared: seven forms of
    Siegel's lemma and Bombieri–Vaaler, seven of Roth's theorem, seven of the
    Subspace Theorem, and five of Evertse's counting of the subspaces.
  authors:
    - "Ralf Stephan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ralf Stephan"

classification:
  arxiv: [math.NT]
  msc2020: ["11J87", "11J68", "11G50", "11J25", "11H06", "11D61", "11D57", "11D59"]

status:
  scope: >-
    The twenty-six declarations named in comparator/std3-flat.json, listed
    under main_results, are Siegel's lemma and Bombieri–Vaaler (ArithmeticHeights
    Layer 5), Roth's theorem (DiophantineApproximation Layer 3), the Subspace
    Theorem (Layers 3.4 and 6) and Evertse's counting of the subspaces (Layer 9).
    The repository proves more than is compared, all within the same three
    axioms: the applications of Layers 7 and 8, and the rest of
    ArithmeticHeights (Northcott, Kronecker, Gelfond, Hadamard, Minkowski's
    second theorem, Vaaler's cube slicing, the unit and S-unit theorems). They
    are left out of the challenge for size, since a challenge is capped at
    1000 lines. Layers 5.3 and 5.4, the basis-of-the-kernel forms of
    Bombieri–Vaaler over a number field, and everything else stated with the
    height of a subspace (Northcott for subspaces, the duality theorem) cannot
    be compared as the development stands: that height's definition reaches
    private lemmas whose names embed their module, which no challenge file can
    reproduce. Evertse's Theorem 2.1 on the large solutions is not proved in
    general: Layer 9.4 takes his interval result as a hypothesis, and that
    hypothesis is discharged only for two variables, through Roth's theorem
    (NumberField.exists_finset_submodule_of_card_eq_two).
