# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Evertse–Ferretti 2013: the Quantitative Subspace Theorem in Lean"
  description: >-
    A Lean 4 / Mathlib formalization of J.-H. Evertse and R. G. Ferretti, A
    further improvement of the Quantitative Subspace Theorem (Ann. of Math.
    177 (2013)), built on the repository's libraries ForMathlib,
    ArithmeticHeights and DiophantineApproximation. The library
    QuantitativeSubspace is sorry-free and within Lean's three standard
    axioms. Along the way it proves the inputs EF13 uses: Rémond's explicit
    form of Faltings' product theorem and Evertse's Roth lemma (Evertse 1995,
    1996), the absolute geometry of numbers of Roy–Thunder and
    Evertse–Schlickewei (twisted heights, the absolute Minkowski theorem),
    and EF13's own Faltings–Wüstholz part (the auxiliary polynomial, the
    filtration, semistability and Chow-free weight bounds). It then proves
    EF13 Theorem 8.1 (the semistable gap), Theorem 2.3 (the parametric
    interval result), Theorem 3.3 for approximation domains, and Theorem 3.1
    (Evertse 2010, Theorem 2.1): the large solutions of a normalized system
    lie in at most 2·10¹³ · 4ⁿ n¹⁴ δ⁻³ · log(3RD/δ) · log(δ⁻¹ log 3RD)
    proper subspaces, EF13's shape with a larger constant, independent of
    the field, the places and the heights. Nine statements are compared.
  authors:
    - "Ralf Stephan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ralf Stephan"

classification:
  arxiv: [math.NT]
  msc2020: ["11J68", "11J25", "11G50", "11H06", "14C17"]

status:
  scope: >-
    The nine declarations named in comparator/quantitative-subspace.json,
    listed under main_results, are EF13 Theorems 3.1, 3.3, 2.3 and 8.1 and
    the closed forms of their counts. Theorem 3.1 is compared for the large
    solutions (above a threshold linear in log H) and, with Evertse 2010
    Theorem 2.2 on the small solutions (DiophantineApproximation Layer 9.3),
    for all solutions. Its count efLargeCount is compared through three
    bounds: the closed form in EF13's variables, the shape before the
    logarithms are compared, and the threshold's linearity in log H.
    Theorem 3.3 is stated for Schmidt's approximation domains (EF13 §5), in
    the shape the repository's DiophantineApproximation Layer 6.1 has. The
    intermediate steps (Rémond's product theorem, Evertse's Roth lemma, the
    non-vanishing result Prop. 12.1, Roy–Thunder's absolute Minkowski
    theorem, the auxiliary polynomial and filtration of §§13–15, Thm 16.1,
    Prop. 17.5, Lemmas 18.1–18.4, Prop. 18.5) are proved in the library but
    not compared. The roadmap's other axes (Bugeaud–Evertse's quantitative
    Roth, higher degree) are not part of this entry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
