# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Evertse 1984: sums of S-units and linear recurrences"
  description: >-
    A Lean 4 / Mathlib formalization of the whole of J.-H. Evertse, On sums
    of S-units and linear recurrences (Compositio Math. 53 (1984)), built on
    the repository's libraries ArithmeticHeights and DiophantineApproximation,
    whose p-adic Subspace Theorem (Schlickewei's, the paper's Theorem 4) it
    uses. The library Evertse1984 is sorry-free and within Lean's three
    standard axioms. It proves Theorem 2 (a lower bound for S-integral sums
    without vanishing subsums, at any set of places), Theorem 1 (finitely
    many admissible projective solutions of x₀ + ⋯ + xₙ = 0), Corollaries 1
    and 2, Lemmas 1 and 2 (polynomial values and shifted polynomial
    quotients that are S-units), Theorem 3 (for a non-degenerate linear
    recurrence with at least two characteristic roots, the largest prime
    ideal norm of u_r / u_s tends to infinity), and Corollaries 3 and 4
    (P(u_r) → ∞; u_r = u_s has finitely many solutions r ≠ s). It also compares
    the paper's cited Theorem 4, the repository's p-adic Subspace Theorem.
    Fourteen statements are compared.
  authors:
    - "Ralf Stephan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ralf Stephan"

classification:
  arxiv: [math.NT]
  msc2020: ["11D61", "11B37", "11J87", "11R27"]

status:
