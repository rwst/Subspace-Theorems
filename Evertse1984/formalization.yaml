fidelity:
  divergences: >-
    Absolute values are Mathlib's: ‖x‖_v is w(x)^mult(w) at an infinite
    place and FinitePlace.mk P x at a prime, the normalization of the
    product formula, which is Evertse's. The products over S∞ ∪ S are
    placeProd; the paper's set T ⊆ S is any set of absolute values, of
    which only the places in S∞ ∪ S count. ‖x‖ is the largest house of a
    coordinate, and heights are Mathlib's mulHeight / mulHeight₁. In
    Theorem 1 the hypothesis c > 0 is kept in EvertseTheorem1 and dropped
    from finite_setOf_admissible_sum_eq_zero, where it is not needed; the
    proof normalizes by an S-unit (a compactness argument) instead of
    Evertse's ideal-norm argument. In Corollary 1 the same holds, and ‖x‖ is
    max_k |x_k|. Lemma 1 has max(|r|, 1) for |r|. Lemma 2 is stated for
    integers r ≠ s with f(r)/g(s) an S-unit, the ideal-norm step replaced by
    the membership ∏(x_i − y_j) ∈ (∏ x_i, ∏ y_j) over the S-integers.
    Theorem 3 and Corollary 3 are stated in the equivalent S-unit form: for
    every finite set S of primes only finitely many r > s have u_s ≠ 0 and
    u_r / u_s (resp. u_r) zero or an S-unit, which is P_K(·) → ∞. A linear
    recurrence is given by its representation u_k = Σ_i f_i(k) α_i^k with
    nonzero α_i, nonzero polynomials f_i, and no quotient α_i / α_j (i ≠ j)
    a root of unity (non-degeneracy); deriving that representation from a
    recurrence relation is not formalized. "At least two characteristic
    roots" is Nontrivial ι. Corollaries 3 and 4 use no hypothesis that u is
    not identically zero: that is proved (linear independence of
    exponential polynomials). Corollary 4's exception "u_k = c α^k with α a
    root of unity" is the hypothesis hone for a subsingleton index type.
    The passage to a splitting field that Evertse makes "without
    restriction" is proved: S-units of K are units of L for the primes
    above S.
    The single-file challenge differs from the development in presentation
    only (see COMPARATOR.md at the repository root). Its Mathlib imports
    follow the development's load order, and each part opens with a run_cmd
    that clears Lean's module-local cache of auxiliary proofs, as a module
    boundary does.

sources:
  - title: "On sums of S-units and linear recurrences"
    authors: ["Jan-Hendrik Evertse"]
    type: paper
    location: >-
      Compositio Math. 53 (1984), 225–244. Theorems 1–3, Corollaries 1–4,
      Lemmas 1 and 2
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      The whole paper. The module docs cite it by page and result.
  - title: "The p-adic Thue–Siegel–Roth–Schmidt theorem"
    authors: ["Hans Peter Schlickewei"]
    type: paper
    location: "Arch. Math. 29 (1977), 267–270; the paper's Theorem 4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Cited by Evertse as Theorem 4; proved in this repository
      (DiophantineApproximation) and certified by comparator/evertse-1984.json
      and comparator/std3-flat.json.

automation:
  methods:
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      role: >-
        The formalization: the plan, the Lean text of the library, the
        challenge and solution modules and the configuration, under the
        releaser's direction.
    - method: manual
      models: []
      role: >-
        Direction and release. Ralf Stephan chose the paper, the conventions
        and the gates, steered the agent turn by turn, and releases the
        repository.
  spend_usd: "subscription-based Claude Code usage; time not recorded"
  notes: >-
    The library is held to the repository's rules by scripts/check.sh (a
    build with Mathlib's linter set as errors, the axiom audit against the
    three standard axioms, the module-system check, the textual guards).
    It has 15 files, and uses the repository's libraries
    ArithmeticHeights and DiophantineApproximation. lake test runs leanprover/comparator over
    comparator/evertse-1984.json against the single Mathlib-only file
    ChallengeEvertse1984.lean, generated from comparator/evertse-1984.txt
    by scripts/make-challenge.py --paper Evertse1984, with the proofs
    re-exported by SolutionEvertse1984.lean. It passes. A negative control
    (a weakened hypothesis of Corollary 4 in the challenge) was confirmed to
    be rejected. Wall time and hardware were not recorded.

review:
  status: unchecked
  notes: >-
    No human or external review of the Lean text or of the fidelity of the
    statements has been performed. What is established is mechanical:
    comparator compares each named statement against the challenge file
    constant by constant, checks the axiom list, and replays the export
    through the Lean kernel.

limitations:
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound
    and nothing else. The library contains no sorry and no native_decide.
    The sorries in the challenge file are the placeholders comparator
    expects, and the configuration fixes no definition holes.
  - >-
    Recurrences enter through their power-sum representation; see
    fidelity. The Subspace Theorem the paper rests on is the repository's
    own (DiophantineApproximation), certified separately.
  - >-
    Everything proved here is in print; no novelty is claimed. The value
    offered is the machine-checked account.

