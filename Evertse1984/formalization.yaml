    The fourteen declarations named in comparator/evertse-1984.json, listed
    under main_results, are every numbered result of the paper. Theorem 4,
    which the paper cites (Schlickewei's p-adic Subspace Theorem), is the
    repository's own DiophantineApproximation Layer 6.4, also certified on
    the repository's main lane (comparator/std3-flat.json). Theorem 1 is compared twice: over a fixed
    number field, and as the closed statement EvertseTheorem1 quantified
    over all number fields. Theorem 3 and Corollaries 3 and 4 are compared
    twice: with characteristic roots and polynomials in K, and for a
    sequence in K whose characteristic roots and polynomials lie in an
    extension L. The intermediate steps (the Subspace step of Theorem 2,
    the normalization by S-units, the split cases of Lemma 2 and Theorem 3,
    linear independence of exponential polynomials) are proved in the
    library but not compared.
