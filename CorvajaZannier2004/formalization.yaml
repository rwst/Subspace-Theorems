      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/corvaja-zannier-2004.json"
      literature_dependencies: []
    - declaration: "Real.isPisot_or_tendsto_log_cfQuot_odd"
      file: "CorvajaZannier2004/PartialQuotients.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/corvaja-zannier-2004.json"
      literature_dependencies: []
