# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Corvaja–Zannier 2004: rational approximations to the powers of an algebraic number"
  description: >-
    A Lean 4 / Mathlib formalization of the whole of P. Corvaja and U. Zannier,
    On the rational approximations to the powers of an algebraic number:
    solution of two problems of Mahler and Mendès France (Acta Math. 193
    (2004)), built on the repository's libraries ArithmeticHeights and
    DiophantineApproximation, whose Subspace Theorem it uses. The library
    CorvajaZannier2004 is sorry-free and within Lean's three standard axioms.
    It proves the Main Theorem (finitely many non-pseudo-Pisot δqu that are
    very close to integers, u in a finitely generated group of algebraic
    numbers), Theorem 1 (Mahler's question: if ‖αⁿ‖ < lⁿ infinitely often,
    some power of α is a Pisot number), Lemmas 1–5, Theorem 2 (Mendès
    France's question: the period of the continued fraction of αⁿ tends to
    infinity unless α is a unit or a square root of a rational, and is
    bounded for units), and the Appendix (the word "algebraic" cannot be
    dropped from Theorem 1). Eleven statements are compared.
  authors:
    - "Ralf Stephan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ralf Stephan"

classification:
  arxiv: [math.NT]
  msc2020: ["11J68", "11R06", "11J70", "11A55", "11J87"]

status:
  scope: >-
    The eleven declarations named in comparator/corvaja-zannier-2004.json,
    listed under main_results, are every numbered result of the paper: the
    Main Theorem, Theorem 1, Lemma 4 (as printed and in the stronger form
    its proof gives), Lemma 5 (both forms), Theorem 2 (a), (b) and (c), and
    the Appendix with its closing remark. Lemmas 1–3 are proved in the
    library (CorvajaZannier2004/LinearRelation.lean, TwoTermRelation.lean,
    SubfieldDescent.lean) but not compared: they are steps of the Main
    Theorem's proof, stated with auxiliary notions of the development. So
    are the continued-fraction facts the paper quotes (Lagrange's and
    Galois's theorems, Serret's theorem, the period of the conjugate), which
    Mathlib lacks and which are proved here.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "finite_setOf_not_isPseudoPisot"
      file: "CorvajaZannier2004/MainTheorem.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/corvaja-zannier-2004.json"
      literature_dependencies: []
    - declaration: "exists_isPisot_pow_of_frequently"
      file: "CorvajaZannier2004/PisotPowers.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/corvaja-zannier-2004.json"
      literature_dependencies: []
    - declaration: "isIntegral_or_exists_pow_eq_ratCast"
      file: "CorvajaZannier2004/IntegralPowerSums.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/corvaja-zannier-2004.json"
      literature_dependencies: []
    - declaration: "isIntegral_of_trace_mul_pow"
      file: "CorvajaZannier2004/IntegralPowerSums.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/corvaja-zannier-2004.json"
      literature_dependencies: []
    - declaration: "Real.isPisot_or_tendsto_log_cfQuot"
